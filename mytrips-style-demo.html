<!DOCTYPE html>
<!--
  「我的行程」卡片風格預覽（拋棄式 demo，不會被 app 載入）。
  四種方案並排，頂部排序下拉可即時重排。挑你喜歡的兩個，跟我說編號即可（例如 ①＋②）。
-->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的行程・卡片風格預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f0;--surface:#fff;--surface2:#f0ede6;
  --ink:#1a1814;--ink2:#5a5750;--ink3:#9a9590;
  --accent:#2a6b5e;--accent-dark:#1f5448;--accent-light:#e8f3f0;
  --gold:#c9a227;--gold-light:#f5e8c0;
  --red:#d94040;--red-light:#fdeaea;
  --border:#e2ddd6;--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7;padding:0 0 80px;}

/* ── demo chrome ── */
.demo-top{position:sticky;top:0;z-index:50;background:rgba(247,245,240,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:18px 28px;}
.demo-top h1{font-family:'DM Serif Display',serif;font-size:30px;color:var(--accent);font-weight:400;}
.demo-top p{font-size:16px;color:var(--ink2);margin-top:2px;}
.demo-controls{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;}
.demo-controls .sort-label{font-size:16px;color:var(--ink3);}
.sort-select{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit;background:var(--surface);color:var(--ink);outline:none;cursor:pointer;}
.sort-select:focus{border-color:var(--accent);}
.demo-section{max-width:1180px;margin:0 auto;padding:34px 28px 8px;}
.demo-h{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;}
.demo-h .num{font-family:'DM Serif Display',serif;font-size:34px;color:var(--accent);line-height:1;}
.demo-h .name{font-size:24px;font-weight:700;}
.demo-h .desc{font-size:15px;color:var(--ink3);}
.demo-divider{max-width:1180px;margin:30px auto 0;border:none;border-top:1px solid var(--border);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;}

/* ════════════════════════════════════════════════════
   方案① 雜誌風 Magazine
   ════════════════════════════════════════════════════ */
.s1 .card{background:linear-gradient(180deg,#fff 0%,#fbfaf7 100%);border:1px solid #e4ded3;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(33,29,24,.08);transition:transform .25s ease,box-shadow .25s ease,border-color .25s;}
.s1 .card:hover{transform:translateY(-6px);box-shadow:0 22px 50px rgba(33,29,24,.16);border-color:#d6cdbd;}
.s1 .cover{height:128px;display:flex;align-items:center;justify-content:center;font-size:58px;position:relative;overflow:hidden;}
.s1 .cover::before{content:attr(data-emoji);position:absolute;right:-14px;bottom:-26px;font-size:120px;opacity:.16;transform:rotate(-8deg);}
.s1 .cover::after{content:'';position:absolute;inset:auto 0 0 0;height:46px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.4));}
.s1 .cover>span{position:relative;z-index:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12));}
.s1 .cc0{background:linear-gradient(135deg,#e8f3f0,#cfe9e1);}
.s1 .cc1{background:linear-gradient(135deg,#fdf0e8,#fbe1c4);}
.s1 .cc2{background:linear-gradient(135deg,#dce8f4,#c4daf0);}
.s1 .cc3{background:linear-gradient(135deg,#f5e8c0,#efd99c);}
.s1 .body{padding:16px 18px 18px;}
.s1 .status{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:5px 11px;border-radius:999px;margin-bottom:11px;}
.s1 .title{font-size:25px;font-weight:900;letter-spacing:.2px;line-height:1.18;margin-bottom:8px;}
.s1 .meta{font-size:15.5px;color:#867f75;margin-bottom:15px;}
.s1 .meta b{color:var(--accent);font-weight:700;}
.s1 .actions{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;}

/* ════════════════════════════════════════════════════
   方案② 玻璃卡 Glass / Aurora
   ════════════════════════════════════════════════════ */
.s2-wrap{position:relative;border-radius:24px;padding:22px;background:
   radial-gradient(900px 380px at 12% -10%,rgba(42,107,94,.16),transparent 60%),
   radial-gradient(700px 360px at 100% 0%,rgba(201,162,39,.16),transparent 55%),
   linear-gradient(180deg,#eef3f1,#f5f1ea);}
.s2 .card{position:relative;border-radius:20px;overflow:hidden;background:rgba(255,255,255,.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 34px rgba(31,40,38,.14);transition:transform .25s ease,box-shadow .25s ease;}
.s2 .card:hover{transform:translateY(-5px);box-shadow:0 20px 48px rgba(31,40,38,.22);}
.s2 .topbar{height:8px;}
.s2 .cc0{background:linear-gradient(90deg,#2a6b5e,#5bbf9f);}
.s2 .cc1{background:linear-gradient(90deg,#d98a3d,#f2c14e);}
.s2 .cc2{background:linear-gradient(90deg,#3d6fb0,#79b4e6);}
.s2 .cc3{background:linear-gradient(90deg,#c9a227,#ecd66a);}
.s2 .body{padding:16px 18px 18px;}
.s2 .head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.s2 .emoji{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 4px 12px rgba(0,0,0,.08);flex-shrink:0;}
.s2 .title{font-size:22px;font-weight:900;line-height:1.2;}
.s2 .status{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:12px;background:rgba(255,255,255,.6);}
.s2 .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px;}
.s2 .chip{font-size:13.5px;font-weight:600;color:var(--ink2);padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.8);}
.s2 .actions{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;}

/* ════════════════════════════════════════════════════
   方案③ 極簡清單 Minimal list
   ════════════════════════════════════════════════════ */
.s3 .grid{grid-template-columns:1fr;gap:12px;max-width:840px;}
.s3 .card{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 18px;transition:border-color .2s,box-shadow .2s,transform .2s;}
.s3 .card:hover{border-color:#cfc6b6;box-shadow:0 8px 22px rgba(33,29,24,.08);transform:translateX(2px);}
.s3 .thumb{width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;}
.s3 .cc0{background:linear-gradient(135deg,#e8f3f0,#cfe9e1);}
.s3 .cc1{background:linear-gradient(135deg,#fdf0e8,#fbe1c4);}
.s3 .cc2{background:linear-gradient(135deg,#dce8f4,#c4daf0);}
.s3 .cc3{background:linear-gradient(135deg,#f5e8c0,#efd99c);}
.s3 .main{flex:1;min-width:0;}
.s3 .row1{display:flex;align-items:center;gap:10px;margin-bottom:3px;}
.s3 .title{font-size:21px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.s3 .status{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;flex-shrink:0;}
.s3 .meta{font-size:15px;color:#867f75;}
.s3 .meta b{color:var(--accent);}
.s3 .actions{display:flex;gap:7px;flex-shrink:0;}
.s3 .actions .btn{padding:0;width:42px;height:42px;font-size:18px;}
.s3 .actions .btn.wide{width:auto;padding:0 14px;font-size:16px;}

/* ════════════════════════════════════════════════════
   方案④ 暗夜風 Dark / Neon
   ════════════════════════════════════════════════════ */
.s4-wrap{background:radial-gradient(800px 400px at 15% -5%,#1b2b35,#0e171d 60%);border-radius:24px;padding:24px;}
.s4 .card{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#18242b,#121b21);border:1px solid #2a3a43;box-shadow:0 12px 34px rgba(0,0,0,.45);transition:transform .25s,box-shadow .25s,border-color .25s;}
.s4 .card:hover{transform:translateY(-5px);border-color:var(--neon,#46d6b3);box-shadow:0 0 0 1px var(--neon,#46d6b3),0 18px 44px rgba(0,0,0,.55),0 0 30px -6px var(--neon,#46d6b3);}
.s4 .cover{height:118px;display:flex;align-items:center;justify-content:center;font-size:54px;position:relative;}
.s4 .cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(14,23,29,.65));}
.s4 .cover>span{position:relative;z-index:1;filter:drop-shadow(0 0 16px rgba(70,214,179,.45));}
.s4 .cc0{--neon:#46d6b3;background:radial-gradient(120% 120% at 30% 0%,rgba(70,214,179,.32),transparent 70%);}
.s4 .cc1{--neon:#f2a94e;background:radial-gradient(120% 120% at 30% 0%,rgba(242,169,78,.32),transparent 70%);}
.s4 .cc2{--neon:#5aa9f0;background:radial-gradient(120% 120% at 30% 0%,rgba(90,169,240,.32),transparent 70%);}
.s4 .cc3{--neon:#e6cf5a;background:radial-gradient(120% 120% at 30% 0%,rgba(230,207,90,.32),transparent 70%);}
.s4 .body{padding:15px 18px 18px;}
.s4 .status{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:4px 11px;border-radius:999px;margin-bottom:11px;color:var(--neon);background:rgba(255,255,255,.06);border:1px solid currentColor;}
.s4 .title{font-size:23px;font-weight:900;line-height:1.2;margin-bottom:8px;color:#eef4f3;}
.s4 .meta{font-size:15px;color:#9fb0b1;margin-bottom:15px;}
.s4 .meta b{color:var(--neon);}
.s4 .actions{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;}

/* ── shared status palette (light schemes) ── */
.status.planning{background:var(--accent-light);color:var(--accent);}
.status.upcoming{background:var(--gold-light);color:#7a5e10;}
.status.copied{background:#ede8fb;color:#5a3aaa;}

/* ── shared buttons (light schemes 1/2/3) ── */
.btn{min-height:44px;padding:8px 12px;border-radius:10px;font-size:15.5px;font-family:inherit;font-weight:700;cursor:pointer;border:1px solid #d8d1c5;background:#fff;color:#6b6459;transition:all .18s;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;}
.btn.replan{color:#2f6f97;}
.btn.share{color:#434f7a;}
.btn.del{width:44px;padding:0;color:var(--red);font-size:18px;}
.btn.del:hover{border-color:var(--red);color:var(--red);background:var(--red-light);}
/* dark scheme buttons */
.s4 .btn{background:rgba(255,255,255,.05);border-color:#33454e;color:#cdd9d8;}
.s4 .btn:hover{border-color:var(--neon);color:var(--neon);background:rgba(70,214,179,.08);}
.s4 .btn.primary{background:var(--neon);color:#0e171d;border-color:var(--neon);}
.s4 .btn.primary:hover{filter:brightness(1.08);color:#0e171d;}
.s4 .btn.del{color:#f08a8a;}
.s4 .btn.del:hover{border-color:#f08a8a;color:#f08a8a;background:rgba(240,138,138,.1);}

@media(max-width:560px){.grid{grid-template-columns:1fr;}.s3 .card{flex-wrap:wrap;}}
</style>
</head>
<body>

<div class="demo-top">
  <h1>我的行程・卡片風格預覽</h1>
  <p>四種方案用同一批資料並排呈現。挑你喜歡的<b>兩個</b>，跟我說編號即可（例如「①＋②」）。排序下拉會即時重排全部。</p>
  <div class="demo-controls">
    <span class="sort-label">排序</span>
    <select class="sort-select" id="sortSel">
      <option value="date_desc">建立時間（新→舊）</option>
      <option value="date_asc">建立時間（舊→新）</option>
      <option value="title">名稱</option>
      <option value="region">地區</option>
      <option value="status">狀態</option>
      <option value="collab">共編優先</option>
    </select>
  </div>
</div>

<section class="demo-section">
  <div class="demo-h"><span class="num">①</span><span class="name">雜誌風</span><span class="desc">大漸層封面＋emoji 浮水印＋柔和陰影＋hover 上浮</span></div>
  <div class="grid s1" id="s1"></div>
</section>
<hr class="demo-divider">

<section class="demo-section">
  <div class="demo-h"><span class="num">②</span><span class="name">玻璃卡</span><span class="desc">霧面半透明＋彩色頂條＋資訊膠囊 chips（頁面加柔光漸層襯托）</span></div>
  <div class="s2-wrap"><div class="grid s2" id="s2"></div></div>
</section>
<hr class="demo-divider">

<section class="demo-section">
  <div class="demo-h"><span class="num">③</span><span class="name">極簡清單</span><span class="desc">小封面縮圖＋單行資訊＋右側按鈕，資訊密度高、適合行程多時快速瀏覽</span></div>
  <div class="s3"><div class="grid" id="s3"></div></div>
</section>
<hr class="demo-divider">

<section class="demo-section">
  <div class="demo-h"><span class="num">④</span><span class="name">暗夜風</span><span class="desc">深底＋霓虹強調色＋發光邊框，與淺色頁形成強對比</span></div>
  <div class="s4-wrap"><div class="grid s4" id="s4"></div></div>
</section>

<script>
// 範例資料（對齊使用者截圖那批 + 涵蓋所有狀態/共編）
const TRIPS = [
  {emoji:'🌊', cc:'cc1', title:'台東 8小時微旅行', days:1, region:'台東', budget:'$1,500',                status:'planning', createdAt:'2026/6/6'},
  {emoji:'✈️', cc:'cc0', title:'綠島 8小時微旅行', days:1, region:'綠島', budget:'節省（每人 $500 內）',     status:'planning', createdAt:'2026/6/9', collab:true},
  {emoji:'🌊', cc:'cc3', title:'台東 8小時微旅行', days:1, region:'台東', budget:'豪華（每人 $3,000 以上）', status:'upcoming', createdAt:'2026/6/10'},
  {emoji:'🌊', cc:'cc2', title:'台東 8小時微旅行', days:1, region:'台東', budget:'舒適（每人 $1,500–$3,000）',status:'planning', createdAt:'2026/6/13'},
  {emoji:'⛩️', cc:'cc2', title:'京都嵐山一日散策', days:1, region:'日本', budget:'$3,500',                status:'copied',   createdAt:'2026/6/2'},
  {emoji:'🌸', cc:'cc0', title:'蘭嶼環島深度2日', days:2, region:'蘭嶼', budget:'$4,200',                status:'upcoming', createdAt:'2026/6/15', collab:true},
];
const STATUS = {planning:'✏️ 規劃中', upcoming:'✈️ 即將出發', copied:'📋 複製的行程'};
const STATUS_ORDER = {planning:0, upcoming:1, copied:2};

function sortTrips(list, mode){
  const a=[...list];
  const t=s=>new Date(String(s).replace(/-/g,'/')).getTime()||0;
  switch(mode){
    case 'date_asc': return a.sort((x,y)=>t(x.createdAt)-t(y.createdAt));
    case 'title':    return a.sort((x,y)=>x.title.localeCompare(y.title,'zh-Hant'));
    case 'region':   return a.sort((x,y)=>x.region.localeCompare(y.region,'zh-Hant'));
    case 'status':   return a.sort((x,y)=>STATUS_ORDER[x.status]-STATUS_ORDER[y.status]);
    case 'collab':   return a.sort((x,y)=>(y.collab?1:0)-(x.collab?1:0));
    case 'date_desc':
    default:         return a.sort((x,y)=>t(y.createdAt)-t(x.createdAt));
  }
}

const actLight = t => `
  ${t.collab?`<button class="btn primary">👥 成員</button>`:`<button class="btn primary">✏️ 編輯</button>`}
  ${t.collab?`<button class="btn replan">✏️ 編輯</button>`:`<button class="btn replan">🔄 重新規劃</button>`}
  <button class="btn share">📤</button>
  <button class="btn del">🗑</button>`;

function render(mode){
  const trips = sortTrips(TRIPS, mode);

  // ① 雜誌風
  document.getElementById('s1').innerHTML = trips.map(t=>`
    <div class="card">
      <div class="cover ${t.cc}" data-emoji="${t.emoji}"><span>${t.emoji}</span></div>
      <div class="body">
        <div class="status ${t.status}">${STATUS[t.status]}</div>
        <div class="title">${t.title}</div>
        <div class="meta"><b>${t.days}天</b> · ${t.region} · ${t.budget} · ${t.createdAt}</div>
        <div class="actions">${actLight(t)}</div>
      </div>
    </div>`).join('');

  // ② 玻璃卡
  document.getElementById('s2').innerHTML = trips.map(t=>`
    <div class="card">
      <div class="topbar ${t.cc}"></div>
      <div class="body">
        <div class="head"><div class="emoji">${t.emoji}</div><div class="title">${t.title}</div></div>
        <div class="status ${t.status}">${STATUS[t.status]}</div>
        <div class="chips">
          <span class="chip">🗓 ${t.days}天</span>
          <span class="chip">📍 ${t.region}</span>
          <span class="chip">💰 ${t.budget}</span>
          <span class="chip">🕑 ${t.createdAt}</span>
        </div>
        <div class="actions">${actLight(t)}</div>
      </div>
    </div>`).join('');

  // ③ 極簡清單
  document.getElementById('s3').innerHTML = trips.map(t=>`
    <div class="card">
      <div class="thumb ${t.cc}">${t.emoji}</div>
      <div class="main">
        <div class="row1"><div class="title">${t.title}</div><span class="status ${t.status}">${STATUS[t.status]}</span></div>
        <div class="meta"><b>${t.days}天</b> · ${t.region} · ${t.budget} · ${t.createdAt}</div>
      </div>
      <div class="actions">
        ${t.collab?`<button class="btn primary wide">👥 成員</button>`:`<button class="btn primary wide">✏️ 編輯</button>`}
        ${t.collab?'':`<button class="btn">🔄</button>`}
        <button class="btn">📤</button>
        <button class="btn del">🗑</button>
      </div>
    </div>`).join('');

  // ④ 暗夜風
  document.getElementById('s4').innerHTML = trips.map(t=>`
    <div class="card">
      <div class="cover ${t.cc}"><span>${t.emoji}</span></div>
      <div class="body">
        <div class="status ${t.status}">${STATUS[t.status]}</div>
        <div class="title">${t.title}</div>
        <div class="meta"><b>${t.days}天</b> · ${t.region} · ${t.budget} · ${t.createdAt}</div>
        <div class="actions">${actLight(t)}</div>
      </div>
    </div>`).join('');
}

document.getElementById('sortSel').addEventListener('change', e=>render(e.target.value));
render('date_desc');
</script>
</body>
</html>
